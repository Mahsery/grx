[package]
name = "grx"
version = "0.2.0+018ef10"
edition = "2024"
authors = ["Mehmet Koseoglu <mehmet.mkoseoglu@gmail.com>"]
description = "Fast, ergonomic grep/ripgrep CLI with a human-friendly search DSL"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
memchr = "2.7"
crossbeam-deque = "0.8"
regex = "1.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "search_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

